name = "prop-tech-cambodia"
compatibility_date = "2026-10-15"
main = "worker/index.js"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "prop-tech-db"
database_id = "REPLACE_WITH_D1_ID"

# KV for sessions and rate limiting
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# R2 for image storage
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "prop-tech-images"

# Environment variables
[vars]
ENVIRONMENT = "production"
JWT_SECRET = "REPLACE_WITH_RANDOM_SECRET"
FROM_EMAIL = "noreply@prop-tech-cambodia.pages.dev"
